<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Новости</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #e0e7ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    max-width: 960px;
    width: 100%;
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(99, 102, 241, 0.15);
    animation: fadeIn 0.6s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .side-panel {
    background: linear-gradient(135deg, #8b5cf6, #a855f7);
    padding: 3rem;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .side-panel::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
  }
  .side-panel h2 {
    font-size: 2rem;
    margin-bottom: 1rem;
    position: relative;
  }
  .side-panel p {
    opacity: 0.9;
    line-height: 1.6;
    position: relative;
    margin-bottom: 2rem;
  }
  .side-illustration {
    position: relative;
    margin: 2rem auto;
  }
  .form-panel {
    padding: 3rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo {
    font-size: 1.25rem;
    font-weight: 700;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 2rem;
    display: inline-block;
  }
  .form-panel h1 {
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }
  .form-panel .subtitle {
    color: #6b7280;
    margin-bottom: 2rem;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .form-group {
    margin-bottom: 1.25rem;
  }
  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: #374151;
  }
  input {
    width: 100%;
    padding: 0.85rem 1rem;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: all 0.2s;
    background: #fafafa;
  }
  input:focus {
    outline: none;
    border-color: #6366f1;
    background: white;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
  }
  .password-strength {
    display: flex;
    gap: 4px;
    margin-top: 0.5rem;
  }
  .strength-bar {
    flex: 1;
    height: 4px;
    background: #e5e7eb;
    border-radius: 2px;
    transition: background 0.3s;
  }
  .strength-text {
    font-size: 0.75rem;
    color: #6b7280;
    margin-top: 0.25rem;
  }
  .checkbox-wrapper {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    font-size: 0.875rem;
    color: #4b5563;
  }
  .checkbox-wrapper input {
    width: auto;
    margin-top: 2px;
  }
  .checkbox-wrapper a {
    color: #6366f1;
    text-decoration: none;
    font-weight: 500;
  }
  .btn-submit {
    width: 100%;
    padding: 0.95rem;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
  }
  .divider {
    text-align: center;
    margin: 1.5rem 0;
    position: relative;
    color: #9ca3af;
    font-size: 0.875rem;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 40%;
    height: 1px;
    background: #e5e7eb;
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }
  .login-link {
    text-align: center;
    color: #6b7280;
    font-size: 0.9rem;
  }
  .login-link a {
    color: #6366f1;
    text-decoration: none;
    font-weight: 600;
  }
  .login-link a:hover { text-decoration: underline; }
  .alert {
    padding: 0.75rem 1rem;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: #065f46;
    border-radius: 10px;
    font-size: 0.875rem;
    margin-bottom: 1rem;
    display: none;
  }
  @media (max-width: 768px) {
    .wrapper { grid-template-columns: 1fr; }
    .side-panel { display: none; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="form-panel">
      <span class="logo">● Новости</span>
      <h1>Создать аккаунт</h1>
      <p class="subtitle">Присоединяйтесь к нашему сообществу</p>
      <div class="alert" id="alert">✓ Аккаунт успешно создан!</div>
      <form id="registerForm" method="POST" action="/register">
        <div class="form-row">
                    <!-- Блок загрузки аватарки -->
            
            <div class="avatar-info">
              <label for="avatar-input" class="avatar-btn">Выбрать фото профиля</label>
              <span class="avatar-hint">JPG, PNG или WEBP до 2 МБ</span>
              <input type="file" id="avatar-input" name="avatar" accept="image/png, image/jpeg, image/webp" hidden>
            </div>

          <style>
            .avatar-upload-container {
              display: flex;
              align-items: center;
              gap: 16px;
              margin-bottom: 20px;
              font-family: system-ui, -apple-system, sans-serif;
            }

            .avatar-preview-wrapper {
              position: relative;
              width: 72px;
              height: 72px;
              border-radius: 50%;
              overflow: hidden;
              background-color: #f3f4f6;
              border: 2px dashed #d1d5db;
              cursor: pointer;
              flex-shrink: 0;
              transition: border-color 0.2s;
            }

            .avatar-preview-wrapper:hover {
              border-color: #2563eb;
            }

            .avatar-preview-wrapper img {
              width: 100%;
              height: 100%;
              object-fit: cover;
            }

            .avatar-overlay {
              position: absolute;
              inset: 0;
              background: rgba(0, 0, 0, 0.4);
              display: flex;
              align-items: center;
              justify-content: center;
              opacity: 0;
              transition: opacity 0.2s;
              font-size: 20px;
            }

            .avatar-preview-wrapper:hover .avatar-overlay {
              opacity: 1;
            }

            .avatar-info {
              display: flex;
              flex-direction: column;
              gap: 4px;
            }

            .avatar-btn {
              display: inline-block;
              padding: 8px 14px;
              background-color: #f3f4f6;
              color: #1f2937;
              font-size: 14px;
              font-weight: 500;
              border-radius: 8px;
              cursor: pointer;
              transition: background-color 0.2s;
              text-align: center;
            }

            .avatar-btn:hover {
              background-color: #e5e7eb;
            }

            .avatar-hint {
              font-size: 12px;
              color: #6b7280;
            }
          </style>

          <script>
            document.getElementById('avatar-input').addEventListener('change', function (event) {
              const file = event.target.files[0];
              if (file) {
                if (file.size > 2 * 1024 * 1024) {
                  alert('Файл слишком большой. Максимальный размер — 2 МБ.');
                  this.value = '';
                  return;
                }
                const reader = new FileReader();
                reader.onload = function (e) {
                  document.getElementById('avatar-preview').src = e.target.result;
                };
                reader.readAsDataURL(file);
              }
            });
          </script>

          <div class="form-group">
            <label for="firstName">Имя</label>
            <input type="text" id="firstName" name="name" placeholder="Иван" required>
          </div>
          <div class="form-group">
            <label for="lastName">Фамилия</label>
            <input type="text" name="surname" id="lastName" placeholder="Иванов" required>
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" name="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" name="password" id="password" placeholder="Минимум 8 символов" required>
          <div class="password-strength">
            <div class="strength-bar" id="bar1"></div>
            <div class="strength-bar" id="bar2"></div>
            <div class="strength-bar" id="bar3"></div>
            <div class="strength-bar" id="bar4"></div>
          </div>
          <div class="strength-text" id="strengthText">Введите пароль</div>
        </div>
        <label class="checkbox-wrapper">
          <input type="checkbox" required>
          <span>Я согласен с <a href="#">условиями использования</a> и <a href="#">политикой конфиденциальности</a></span>
        </label>
        <button type="submit" class="btn-submit">Создать аккаунт</button>
      </form>
      <div class="divider">или</div>
      <p class="login-link">Уже есть аккаунт? <a href="login">Войти</a></p>
    </div>
    <div class="side-panel">
      <h2>Присоединяйтесь!</h2>
      <p>Создайте аккаунт и получите доступ к новостной ленте, возможность публиковать свои материалы и общаться с сообществом.</p>
      <svg class="side-illustration" width="220" height="220" viewBox="0 0 220 220" fill="none">
        <circle cx="110" cy="110" r="90" fill="rgba(255,255,255,0.15)"/>
        <circle cx="110" cy="85" r="30" fill="white" opacity="0.9"/>
        <path d="M60 160 Q110 120 160 160 L160 190 L60 190 Z" fill="white" opacity="0.9"/>
        <circle cx="170" cy="60" r="12" fill="white" opacity="0.4"/>
        <circle cx="45" cy="150" r="10" fill="white" opacity="0.4"/>
        <path d="M150 110 L170 130 L195 95" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
      </svg>
    </div>
  </div>

  <script>
    const password = document.getElementById('password');
    const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3'), document.getElementById('bar4')];
    const strengthText = document.getElementById('strengthText');
    
    password.addEventListener('input', function() {
      const val = this.value;
      let strength = 0;
      if (val.length >= 8) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;
      
      const colors = ['#ef4444', '#f59e0b', '#eab308', '#10b981'];
      const texts = ['Слабый', 'Средний', 'Хороший', 'Отличный'];
      
      bars.forEach((bar, i) => {
        bar.style.background = i < strength ? colors[strength - 1] : '#e5e7eb';
      });
      strengthText.textContent = val ? texts[strength - 1] || 'Очень слабый' : 'Введите пароль';
    });

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const alert = document.getElementById('alert');
      alert.style.display = 'block';
      setTimeout(() => {
        window.location.href = 'main';
      }, 800);
    });
  </script>
</body>
</html>
