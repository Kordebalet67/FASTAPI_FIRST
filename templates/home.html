<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h2>Добро пожаловать, {{ username }}!</h2>
    
    <p><b>Хэшированный пароль:</b> {{ password_hash }}</p>
    <button onclick="toggleTheme()">Сменить тему</button>
    <img src="{{ avatar }}" alt="" style="width: 150px; height: 150px; object-fit: cover; border-radius: 50%;">
</div> 
<script>
function toggleTheme() {
    document.body.classList.toggle("dark");
}
</script>
</body>
</html>
